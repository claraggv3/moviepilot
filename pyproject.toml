[tool.poetry]
name = "moviepilot"
version = "0.1.0"
description = "Agentic movie recommendation chatbot with RAG"
authors = ["Clara"]
packages = [{ include = "moviepilot", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
# LangChain / LangGraph — pin tightly, minor drift breaks the graph
langgraph = ">=0.2.0,<0.4"
langchain-openai = ">=0.1.0,<0.3"
langchain-core = ">=0.2.0,<0.4"
# Vector store
chromadb = ">=0.5.0,<1.0"
# HTTP + resilience
httpx = ">=0.27.0"
tenacity = ">=8.0.0"
cachetools = ">=5.0.0"
# Config + validation
pydantic-settings = ">=2.0.0"
# Logging
structlog = ">=24.0.0"
# CLI
typer = ">=0.12.0"
# NLP
spacy = ">=3.7.0"
rank-bm25 = ">=0.2.2"
langgraph-checkpoint-sqlite = ">=2.0.10,<3.0.0"
# UI
streamlit = ">=1.31.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
respx = ">=0.21.0"
ruff = ">=0.5.0"

[tool.poetry.group.langfuse]
optional = true

[tool.poetry.group.langfuse.dependencies]
langfuse = ">=2.0.0"

[tool.poetry.scripts]
chatbot = "moviepilot.cli:app"
moviepilot-ui = "moviepilot.app:run_ui"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: tests that call real external APIs (require credentials)"]
